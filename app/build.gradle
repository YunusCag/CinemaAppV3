plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace AppConfig.applicationId
    compileSdk AppConfig.compileSdk

    defaultConfig {
        applicationId AppConfig.applicationId
        minSdk AppConfig.minSdk
        targetSdk AppConfig.targetSdk
        versionCode AppConfig.versionCode
        versionName AppConfig.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    // Signing credentials are read from local.properties (not version controlled);
    // gradle.properties is used as a fallback for backwards compatibility.
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file("local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { localProperties.load(it) }
    }
    def signingProperty = { String key, String defaultValue ->
        def value = localProperties.getProperty(key)
        if (value == null || value.trim().isEmpty()) {
            value = project.hasProperty(key) ? project.property(key) : defaultValue
        }
        return value?.toString()?.trim()
    }

    def releaseStoreFile = signingProperty("RELEASE_STORE_FILE", "")
    def releaseKeystore = releaseStoreFile ? file(releaseStoreFile) : null

    signingConfigs {
        if (releaseKeystore != null && releaseKeystore.exists()) {
            release {
                storeFile releaseKeystore
                storePassword signingProperty("RELEASE_STORE_PASSWORD", "")
                keyAlias signingProperty("RELEASE_KEY_ALIAS", "")
                keyPassword signingProperty("RELEASE_KEY_PASSWORD", "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The keystore is not checked in; build unsigned when it is unavailable
            // so that the release variant still compiles on a fresh machine.
            if (releaseKeystore != null && releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Release keystore not found (RELEASE_STORE_FILE=${releaseStoreFile}); building release unsigned.")
            }
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    coreLibraryDesugaring(Desugar.jdkLibs)

    implementation(Compose.activityCompose)
    implementation(platform(Compose.composeBOM))
    implementation(Compose.composeUI)
    implementation(Compose.composeUIGraphic)
    implementation(Compose.composeToolingPreview)

    implementation(Compose.hiltNavigationCompose)
    implementation(Compose.material)
    implementation(Compose.navigation)
    implementation(Compose.viewModelCompose)
    implementation(Compose.activityCompose)

    implementation(AndroidX.coreKtx)
    implementation(AndroidX.appCompat)

    implementation(DaggerHilt.hiltAndroid)
    ksp(DaggerHilt.hiltCompiler)

    implementation(Google.material)
    implementation(Coil.coilCompose)
    implementation Google.accompanistNavigationAnimation
    implementation(Compose.splash)

    implementation platform(Google.firebaseBOM)
    implementation Google.firebaseAnalytics
    implementation Google.firebaseCrashlytics
    implementation Google.adMob
    implementation Google.ump

    implementation(Retrofit.okHttp)
    implementation(Retrofit.retrofit)
    implementation(Retrofit.okHttpLoggingInterceptor)
    implementation(Retrofit.moshiConverter)

    ksp(Room.roomCompiler)
    implementation(Room.roomKtx)
    implementation(Room.roomRuntime)

    implementation Timber.timber

    api project(Modules.core)
    api project(Modules.core_ui)
    api project(Modules.splash)
    api project(Modules.onBoarding)
    api project(Modules.home)
    api project(Modules.movieDetail)

    testImplementation(Testing.junit4)
    androidTestImplementation(Testing.junitAndroidExt)
    androidTestImplementation(platform(Compose.composeBOM))
    androidTestImplementation(Compose.composeUnitTest)
    debugImplementation(Compose.composeDebugTest)
    debugImplementation(Compose.composeDebugTestManifest)
}